name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3

      - uses: ./.github/actions/linux-build-deps

      - name: Check
        run: cargo check --verbose

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  static-link:
    name: static link (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The release workflow builds with PRISM_STATIC=1, a materially different
    # link path: Prism's own PRIVATE dependencies are replayed at our link, and
    # the archive is pulled in whole so its built-in backend registrars survive.
    # None of that is exercised by an ordinary build, so without this job a
    # break only surfaces once a tag is pushed -- which is how v0.1.1 failed on
    # all five targets.
    env:
      PRISM_STATIC: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3

      - uses: ./.github/actions/linux-build-deps

      - name: Build + test against a statically linked Prism
        run: |
          cargo build --release --verbose
          cargo test --verbose

      - name: Verify the binary carries no dynamic Prism dependency
        if: runner.os != 'Windows'
        shell: bash
        # A leftover DT_NEEDED/LC_LOAD_DYLIB on Prism means the archive did not
        # actually get linked in. The binary would still start here and die in
        # the loader on a machine without Prism installed -- silently, since
        # this is a GUI app, so the user gets no error and no speech.
        run: |
          bin=target/release/hn-blind
          if [ "$RUNNER_OS" = "Linux" ]; then
            deps=$(readelf -d "$bin" | grep NEEDED || true)
          else
            deps=$(otool -L "$bin" || true)
          fi
          if grep -qi prism <<<"$deps"; then
            echo "::error::$bin still depends on a shared Prism:"
            grep -i prism <<<"$deps"
            exit 1
          fi
          echo "no shared Prism dependency"

      - name: Verify the binary carries no dynamic Prism dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "target/release/hn-blind.exe"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          if ($text.Contains("prism.dll")) {
            Write-Output "::error::$exe still imports prism.dll"
            exit 1
          }
          # Prism loads the screen-reader DLLs itself at run time, so none of
          # them may be a load-time import: those DLLs ship with the screen
          # readers, and an exe that hard-imports one will not start on a
          # machine without it. Their names do appear in the binary as strings
          # for that run-time loader, so ask the import table rather than grep.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) {
            Write-Output "::error::dumpbin.exe not found"
            exit 1
          }
          $deps = & $dumpbin /dependents $exe | Out-String
          Write-Output $deps
          foreach ($dll in "ZDSRAPI_x64.dll", "PCTKUSR.dll") {
            if ($deps -match [regex]::Escape($dll)) {
              Write-Output "::error::$exe imports $dll at load time"
              exit 1
            }
          }
          Write-Output "statically linked, no screen-reader DLL imported at load time"
