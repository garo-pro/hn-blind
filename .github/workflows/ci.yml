name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libclang-dev \
            pkg-config \
            libgtk-3-dev \
            libpng-dev \
            libjpeg-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libexpat1-dev \
            libtiff-dev \
            libwebkit2gtk-4.1-dev \
            libxtst-dev \
            libsm-dev \
            libice-dev \
            libspeechd-dev

      - name: Check
        run: cargo check --verbose

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose
